<!-- @dsCard group="Contenido" height=230 subtitle="Con sabores y con nota" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui)}
.root{padding:16px;display:flex;flex-direction:column;gap:10px;max-width:358px}
.card{display:flex;gap:12px;padding:12px;border-radius:var(--radius-lg);background:var(--surface);color:var(--ink);text-decoration:none}
.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.thumb{width:var(--thumb-size);height:var(--thumb-size);flex-shrink:0;border-radius:var(--radius-sm);background:var(--surface-strong);display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.body{display:flex;flex-direction:column;gap:4px;flex-grow:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font:400 19px/22px var(--font-display)}
.score{font:600 14px/20px var(--font-ui);color:var(--primary-pressed);white-space:nowrap}
.meta{font:400 13px/18px var(--font-ui);color:var(--ink-soft)}
.tags{display:flex;gap:6px;margin-top:2px}
.tag{font:400 12px/16px var(--font-ui);padding:3px 9px;border-radius:var(--radius-pill);background:var(--bg)}
.quote{font:italic 400 13px/18px var(--font-display);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="root">
  <a class="card" href="#nota">
    <span class="thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"></path><circle cx="12" cy="13" r="3"></circle></svg></span>
    <span class="body">
      <span class="top"><span class="name">Rock natural</span><span class="score">4 · Muy rico</span></span>
      <span class="meta">[Marca] · V60 · 8:14</span>
      <span class="tags"><span class="tag">Frutos rojos</span><span class="tag">Panela</span></span>
    </span>
  </a>
  <a class="card" href="#nota">
    <span class="thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"></path><circle cx="12" cy="13" r="3"></circle></svg></span>
    <span class="body">
      <span class="top"><span class="name">Geisha lavado</span><span class="score">5 · Wow</span></span>
      <span class="meta">[Marca] · Chemex · 7:40</span>
      <span class="quote">"Jazmín clarísimo, lo repito el finde"</span>
    </span>
  </a>
</div>
</body>
</html>
