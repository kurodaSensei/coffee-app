<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ambient-olive" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#556B3A" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#556B3A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-honey" cx="95%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#E5B84B" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#E5B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#141712"/>
  <rect width="1200" height="630" fill="url(#ambient-olive)"/>
  <rect width="1200" height="630" fill="url(#ambient-honey)"/>

  <!-- Eyebrow line -->
  <text x="80" y="115"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="22"
    fill="#F4F2EB"
    fill-opacity="0.6"
    letter-spacing="3.5"
    font-weight="500">— BETA PRIVADA · 2026</text>

  <!-- Wordmark Sorbo. -->
  <text x="80" y="290"
    font-family="'DM Serif Display', ui-serif, Georgia, serif"
    font-size="180"
    fill="#F4F2EB"
    letter-spacing="-3">Sorbo<tspan fill="#E5B84B">.</tspan></text>

  <!-- Headline -->
  <text x="80" y="380"
    font-family="'DM Serif Display', ui-serif, Georgia, serif"
    font-style="italic"
    font-size="48"
    fill="#F4F2EB"
    fill-opacity="0.85">Un diario para cada</text>
  <text x="80" y="440"
    font-family="'DM Serif Display', ui-serif, Georgia, serif"
    font-style="italic"
    font-size="48"
    fill="#E5B84B">sorbo de café.</text>

  <!-- Author tag -->
  <text x="80" y="555"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="20"
    fill="#F4F2EB"
    fill-opacity="0.45"
    letter-spacing="3"
    font-weight="500">— POR KURODACAFE</text>

  <!-- ─── Cup illustration (right side) ─── -->
  <g transform="translate(900, 195)">
    <!-- Steam wisps (honey) -->
    <g opacity="0.7" stroke="#E5B84B" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M-40 -10 Q-55 -50 -40 -90 Q-25 -130 -40 -170"/>
      <path d="M0 -10 Q-15 -50 0 -90 Q15 -130 0 -170" opacity="1.15"/>
      <path d="M40 -10 Q25 -50 40 -90 Q55 -130 40 -170"/>
    </g>

    <!-- Saucer shadow -->
    <ellipse cx="0" cy="200" rx="135" ry="14" fill="#5F6652" opacity="0.7"/>
    <!-- Cup body -->
    <path
      d="M-100 30 L-100 175 Q-100 195 -80 195 L60 195 Q80 195 80 175 L80 30 Z"
      fill="#F4F2EB"/>
    <!-- Handle -->
    <path
      d="M80 65 Q125 65 125 110 Q125 155 80 155"
      stroke="#F4F2EB"
      stroke-width="18"
      fill="none"
      stroke-linecap="round"/>
    <!-- Coffee surface (olive) -->
    <ellipse cx="-10" cy="33" rx="95" ry="10" fill="#556B3A"/>
  </g>
</svg>
